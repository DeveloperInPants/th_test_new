<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обучение | Tea Master HUB</title>
    
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/glassmorphism.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/navigation.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="main-layout">
        <div class="bg-overlay"></div>
        
        <div id="nav-placeholder"></div>

        <main class="content-wrapper">
            <header style="margin-bottom: 40px;">
                <h1 class="text-gradient">Учебный центр</h1>
                <p style="color: var(--text-dim);">Ваши активные курсы и программа повышения квалификации.</p>
            </header>

            <section>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                    <h2 style="font-size: 1.5rem;">Актуальные программы</h2>
                    <div class="badge" style="background: rgba(99, 102, 241, 0.2); color: var(--accent-blue); border: 1px solid var(--accent-blue);">
                        В процессе: 2
                    </div>
                </div>

                <div class="grid-container" id="courses-grid">
                    <div style="padding: 100px; text-align: center; width: 100%; grid-column: 1 / -1;">
                        <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 2rem; color: var(--accent-purple);"></i>
                        <p style="margin-top: 15px; color: var(--text-dim);">Загружаем учебный план...</p>
                    </div>
                </div>
            </section>

            <section style="margin-top: 50px;" id="tests-section">
                <h2 style="margin-bottom: 25px;">Доступные тесты</h2>
                <div class="glass-panel" style="padding: 0; overflow: hidden;">
                    <table style="width: 100%; border-collapse: collapse; text-align: left;">
                        <thead style="background: rgba(255,255,255,0.05);">
                            <tr>
                                <th style="padding: 15px 25px;">Название теста</th>
                                <th style="padding: 15px 25px;">Категория</th>
                                <th style="padding: 15px 25px;">Статус</th>
                                <th style="padding: 15px 25px; text-align: right;">Действие</th>
                            </tr>
                        </thead>
                        <tbody id="tests-table-body">
                            <tr style="border-top: 1px solid rgba(255,255,255,0.05);">
                                <td style="padding: 15px 25px;">Классификация чая</td>
                                <td style="padding: 15px 25px;"><span class="badge">База</span></td>
                                <td style="padding: 15px 25px; color: #10b981;">Пройден</td>
                                <td style="padding: 15px 25px; text-align: right;">
                                    <button class="glass-button" style="padding: 5px 15px; font-size: 0.8rem;" onclick="initTestEngine('l2')">Пересдать</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="test-modal" class="overlay-blur" style="display: none; justify-content: center; align-items: center; z-index: 2000;">
        <div class="test-container" style="width: 100%; display: flex; justify-content: center;">
            </div>
    </div>

    <script src="./js/supabase-config.js"></script>
    <script src="./js/data.js"></script>
    <script src="./js/modules/auth.js"></script>
    <script src="./js/modules/ui-utils.js"></script>
    <script src="./js/modules/task-logic.js"></script>
    <script src="./js/main.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Отрисовка курсов
            const coursesGrid = document.getElementById('courses-grid');
            if (coursesGrid && typeof UI !== 'undefined') {
                coursesGrid.innerHTML = TeaHubData.courses.map(c => UI.renderCourseCard(c)).join('');
            }

            // Логика открытия модалки теста (если запуск через кнопку)
            window.openTest = (testId) => {
                const modal = document.getElementById('test-modal');
                modal.style.display = 'flex';
                if (typeof initTestEngine === 'function') {
                    initTestEngine(testId);
                }
            };
        });
    </script>
</body>
</html>
