<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой профиль | Tea Master HUB</title>
    
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/glassmorphism.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/navigation.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="main-layout">
        <div class="bg-overlay"></div>
        
        <div id="nav-placeholder"></div>

        <main class="content-wrapper">
            <section class="glass-panel" style="padding: 40px; margin-bottom: 30px; display: flex; align-items: center; gap: 30px; flex-wrap: wrap;">
                <div style="position: relative;">
                    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=200&auto=format&fit=crop" 
                         alt="Аватар" class="user-avatar" style="width: 120px; height: 120px; border-width: 4px;">
                    <div style="position: absolute; bottom: 5px; right: 5px; background: #10b981; width: 20px; height: 20px; border-radius: 50%; border: 3px solid #1a1a1a;"></div>
                </div>
                
                <div>
                    <h1 class="user-name-display" style="margin-bottom: 5px;">Загрузка...</h1>
                    <p id="user-role-display" class="badge" style="background: var(--accent-blue);">Сотрудник</p>
                    <p style="color: var(--text-dim); margin-top: 10px;">
                        <i class="fa-solid fa-location-dot"></i> Чайная станция №1, Москва
                    </p>
                </div>

                <div style="margin-left: auto;">
                    <button class="glass-button" onclick="Auth.logout()">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i> Выйти
                    </button>
                </div>
            </section>

            <div class="grid-container" id="profile-stats-grid" style="margin-bottom: 30px;">
                <div class="glass-card stat-card">
                    <span class="stat-value" id="stat-tasks">0</span>
                    <span class="stat-label">Заданий выполнено</span>
                </div>
                <div class="glass-card stat-card">
                    <span class="stat-value" id="stat-score">0%</span>
                    <span class="stat-label">Средний балл</span>
                </div>
                <div class="glass-card stat-card">
                    <span class="stat-value" id="stat-hours">0</span>
                    <span class="stat-label">Часов обучения</span>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 30px;">
                <section class="glass-panel" style="padding: 30px;">
                    <h2 style="margin-bottom: 20px;">Моё обучение</h2>
                    <div id="user-courses-list">
                        </div>
                    <button class="glass-button" onclick="location.href='tasks.html'" style="margin-top: 20px; width: 100%;">
                        Перейти ко всем курсам
                    </button>
                </section>

                <section class="glass-panel" style="padding: 30px;">
                    <h2 style="margin-bottom: 20px;">Награды</h2>
                    <div style="display: flex; flex-wrap: wrap; gap: 15px; justify-content: center;">
                        <div title="Первый тест" style="opacity: 1;"><i class="fa-solid fa-award" style="font-size: 2.5rem; color: #ffd700;"></i></div>
                        <div title="Мастер улунов" style="opacity: 0.3;"><i class="fa-solid fa-leaf" style="font-size: 2.5rem; color: #8fbc8f;"></i></div>
                        <div title="7 дней подряд" style="opacity: 0.3;"><i class="fa-solid fa-fire" style="font-size: 2.5rem; color: #ff4500;"></i></div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="./js/supabase-config.js"></script>
    <script src="./js/data.js"></script>
    <script src="./js/modules/auth.js"></script>
    <script src="./js/modules/ui-utils.js"></script>
    <script src="./js/main.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = Auth.getCurrentUser();
            if (!user) return;

            // 1. Отображаем данные пользователя
            document.querySelector('.user-name-display').textContent = user.name;
            document.getElementById('user-role-display').textContent = user.role === 'master' ? 'Мастер' : 'Сотрудник';

            // 2. Заполняем статистику из data.js
            const stats = TeaHubData.userStats.employee;
            document.getElementById('stat-tasks').textContent = stats.tasksCompleted;
            document.getElementById('stat-score').textContent = stats.averageScore + '%';
            document.getElementById('stat-hours').textContent = stats.totalHours;

            // 3. Отрисовываем пару карточек курсов для примера
            const coursesContainer = document.getElementById('user-courses-list');
            const myCourses = TeaHubData.courses.slice(0, 2); // Берем первые два
            coursesContainer.innerHTML = myCourses.map(c => UI.renderCourseCard(c)).join('');
        });
    </script>
</body>
</html>
