<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>База знаний | Tea Master HUB</title>
    
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/glassmorphism.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/navigation.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="main-layout">
        <div class="bg-overlay"></div>
        
        <div id="nav-placeholder"></div>

        <main class="content-wrapper">
            <header style="margin-bottom: 40px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 20px;">
                <div>
                    <h1 class="text-gradient">База знаний</h1>
                    <p style="color: var(--text-dim);">Изучайте ассортимент, особенности сортов и правила приготовления.</p>
                </div>
                
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass form-icon" style="left: 15px; position: absolute; opacity: 0.5;"></i>
                    <input type="text" class="glass-input" id="product-search" placeholder="Поиск по названию..." style="width: 300px; padding-left: 45px;">
                </div>
            </header>

            <div style="display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap;">
                <button class="glass-button filter-btn active" data-category="all">Все</button>
                <button class="glass-button filter-btn" data-category="tea">Чай</button>
                <button class="glass-button filter-btn" data-category="coffee">Кофе</button>
            </div>

            <div class="grid-container" id="products-grid">
                <div style="padding: 100px; text-align: center; width: 100%; grid-column: 1 / -1;">
                    <i class="fa-solid fa-spinner fa-spin" style="font-size: 2rem; color: var(--accent-blue);"></i>
                </div>
            </div>
        </main>
    </div>

    <div id="product-modal" class="overlay-blur" style="display: none; justify-content: center; align-items: center; z-index: 2000;">
        <div class="glass-modal" style="max-width: 600px; width: 90%; position: relative;">
            <button onclick="document.getElementById('product-modal').style.display='none'" 
                    style="position: absolute; top: 20px; right: 20px; background: none; border: none; color: #fff; cursor: pointer; font-size: 1.5rem;">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div id="modal-body">
                </div>
        </div>
    </div>

    <script src="./js/supabase-config.js"></script>
    <script src="./js/data.js"></script>
    <script src="./js/modules/auth.js"></script>
    <script src="./js/modules/ui-utils.js"></script>
    <script src="./js/modules/products-logic.js"></script>
    <script src="./js/main.js"></script>

    <script>
        // Небольшая визуальная логика для кнопок фильтров
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                // Добавляем стиль активной кнопки (белый фон, черный текст)
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.style.background = 'rgba(255, 255, 255, 0.1)';
                    b.style.color = 'white';
                });
                this.style.background = 'white';
                this.style.color = 'black';
            });
        });
        
        // Устанавливаем стиль для первой кнопки (Все) при загрузке
        const allBtn = document.querySelector('.filter-btn[data-category="all"]');
        if (allBtn) {
            allBtn.style.background = 'white';
            allBtn.style.color = 'black';
        }
    </script>
</body>
</html>
